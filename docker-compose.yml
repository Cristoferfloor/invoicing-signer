services:
  signer:
    build: .
    image: signer-service:0.2.1
    container_name: signer-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIGNER_PORT:-3001}:3001"
    env_file:
      - .env
    networks: [pac-invoicing-v2]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


networks:
  pac-invoicing-v2:
    external: true
